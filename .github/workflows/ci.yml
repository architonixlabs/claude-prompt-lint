name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: tests + eval (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Byte-compile (syntax check)
        run: python -m compileall -q cpl hooks eval tests

      - name: Unit tests (stdlib unittest, zero deps)
        run: python -m unittest discover -s tests -v

      - name: Gate eval — fail if any good prompt is flagged (FPR must be 0%)
        run: |
          python eval/run_eval.py | tee /tmp/eval.out
          if grep -E "False Positive Rate" /tmp/eval.out | grep -qvE ":\s+0\.0%"; then
            echo "::error::Gate false-positive rate is non-zero — see eval output above."
            exit 1
          fi
